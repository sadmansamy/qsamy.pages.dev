<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Qsamy || Bill</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #f0f2f5;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        }

        #feed {
            max-width: 600px;
            margin: 0 auto;
            padding: 10px 0;
        }

        .post {
            background-color: #ffffff;
            margin-bottom: 15px;
            box-shadow: 0 1px 2px rgba(0, 0, 0, 0.1);
        }

        .photo-name {
            padding: 15px;
            font-weight: bold;
            font-size: 16px;
            color: #1c1e21;
        }

        .photo-img {
            width: 100%;
            height: auto;
            display: block;
        }
    </style>
</head>
<body>

    <div id="feed"></div>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            
            // Updated to fetch aaa_imagelist.json
            fetch('aaa_imagelist.json')
                .then(response => response.json())
                .then(photos => {
                    const feedContainer = document.getElementById('feed');

                    photos.forEach(photo => {
                        const postDiv = document.createElement('div');
                        postDiv.className = 'post';

                        const nameDiv = document.createElement('div');
                        nameDiv.className = 'photo-name';
                        nameDiv.textContent = photo.name;

                        const img = document.createElement('img');
                        img.src = photo.url;
                        img.alt = photo.name;
                        img.className = 'photo-img';

                        postDiv.appendChild(nameDiv);
                        postDiv.appendChild(img);

                        feedContainer.appendChild(postDiv);
                    });
                })
                .catch(error => {
                    console.error('Error loading photos:', error);
                    document.getElementById('feed').innerHTML = '<p style="text-align:center;">Could not load photos.</p>';
                });
        });
    </script>
</body>
</html>
