<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Palli Bidyut 1060065233509</title>
    <style>
        :root {
            --bg-color: #f4f0fa;
            --card-bg: #ffffff;
            --card-border: #e9e1f5;
            --primary-accent: #6b21a8;
            --secondary-accent: #9333ea;
            --text-primary: #1e1333;
            --text-secondary: #6b5b85;
            --success-color: #16a34a;
            --border-radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            color: var(--text-primary);
            padding-bottom: 40px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(147, 51, 234, 0.06) 0%, transparent 60%),
                radial-gradient(circle at 100% 100%, rgba(107, 33, 168, 0.04) 0%, transparent 50%);
            background-attachment: fixed;
        }

        /* Modern App Header */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(255, 255, 255, 0.88);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
            color: var(--primary-accent);
        }

        /* Status Dot */
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--secondary-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px rgba(147, 51, 234, 0.5);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(147, 51, 234, 0.6); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(147, 51, 234, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(147, 51, 234, 0); }
        }

        /* Account Badge & Copy Button */
        .account-number-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            background: #ede7f6;
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid var(--card-border);
            transition: all 0.3s ease;
        }

        .account-number-container:hover {
            border-color: rgba(147, 51, 234, 0.4);
            box-shadow: 0 2px 8px rgba(147, 51, 234, 0.12);
        }

        .account-number {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.8px;
            font-weight: 600;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s ease;
        }

        .copy-btn:hover {
            color: var(--primary-accent);
            transform: scale(1.1);
        }

        .copy-btn svg {
            width: 15px;
            height: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Segmented Light Purple Tab Switcher */
        .tab-switcher {
            display: flex;
            background: #e9e1f5;
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
        }

        .tab-btn.active {
            background: #ffffff;
            color: var(--primary-accent);
            box-shadow: 0 4px 12px rgba(107, 33, 168, 0.1);
        }

        /* View Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Light Card Design */
        .post {
            background: var(--card-bg);
            margin-bottom: 20px;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--card-border);
            box-shadow: 0 4px 16px rgba(107, 33, 168, 0.04);
            transition: all 0.3s ease;
        }

        .post:hover {
            border-color: rgba(147, 51, 234, 0.3);
            transform: translateY(-2px);
            box-shadow: 0 8px 24px rgba(107, 33, 168, 0.08);
        }

        .photo-name {
            padding: 14px 18px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--card-border);
            letter-spacing: 0.2px;
        }

        .photo-container {
            background-color: #fcfaff;
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .photo-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            border: 1px solid var(--card-border);
            cursor: pointer;
            transition: transform 0.2s ease;
        }

        .photo-img:hover {
            opacity: 0.95;
        }

        /* Application Status Action Link */
        .status-link-card {
            margin-top: 24px;
            text-align: center;
        }

        .status-btn {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
            width: 100%;
            padding: 14px 20px;
            background: linear-gradient(135deg, var(--primary-accent) 0%, var(--secondary-accent) 100%);
            color: #ffffff;
            font-size: 14px;
            font-weight: 600;
            text-decoration: none;
            border-radius: var(--border-radius);
            box-shadow: 0 4px 14px rgba(107, 33, 168, 0.2);
            transition: all 0.3s ease;
        }

        .status-btn:hover {
            transform: translateY(-2px);
            box-shadow: 0 6px 20px rgba(107, 33, 168, 0.3);
            opacity: 0.95;
        }

        .status-btn svg {
            width: 16px;
            height: 16px;
        }

        /* Fullscreen Image Lightbox Viewer */
        .lightbox-modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            background-color: rgba(15, 10, 25, 0.92);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            z-index: 2000;
            overflow: hidden;
            touch-action: none;
        }

        .lightbox-modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            animation: fadeIn 0.25s ease;
        }

        @keyframes fadeIn {
            from { opacity: 0; }
            to { opacity: 1; }
        }

        .lightbox-img {
            max-width: 90vw;
            max-height: 85vh;
            object-fit: contain;
            transition: transform 0.1s linear;
            cursor: grab;
            user-select: none;
        }

        .lightbox-img:active {
            cursor: grabbing;
        }

        /* Lightbox Control Buttons */
        .lightbox-controls {
            position: absolute;
            bottom: 30px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 12px;
            background: rgba(255, 255, 255, 0.15);
            backdrop-filter: blur(10px);
            padding: 8px 16px;
            border-radius: 30px;
            border: 1px solid rgba(255, 255, 255, 0.2);
            z-index: 2100;
        }

        .control-btn {
            background: none;
            border: none;
            color: #ffffff;
            font-size: 18px;
            font-weight: bold;
            width: 36px;
            height: 36px;
            border-radius: 50%;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: background 0.2s;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.25);
        }

        .close-btn {
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(255, 255, 255, 0.15);
            border: 1px solid rgba(255, 255, 255, 0.2);
            color: #ffffff;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            font-size: 20px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 2100;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 0;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            <span class="live-dot"></span>
            <h1>Palli Bidyut (Postpaid)</h1>
        </div>
        <div class="account-number-container">
            <span class="account-number" id="accountNo">1060065233509</span>
            <button class="copy-btn" onclick="copyAccountNo()" title="Copy Account Number" id="copyBtn">
                <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Segmented Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" onclick="switchTab('receipts')">Receipts</button>
            <button class="tab-btn" onclick="switchTab('bills')">Bills</button>
        </div>

        <!-- Panel 1: Receipts -->
        <div id="receipts" class="tab-panel active"></div>

        <!-- Panel 2: Bills -->
        <div id="bills" class="tab-panel">
            <div id="bills-feed"></div>
            
            <!-- Bottom Link for Application Status -->
            <div class="status-link-card">
                <a href="http://www.rebpbs.com/UI/OfficeAutomation/Monitoring/ConsumerManagement/frmApplicationStatusPublic.aspx" target="_blank" rel="noopener noreferrer" class="status-btn">
                    <span>Check Palli Bidyut Application Status</span>
                    <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M10 6H6a2 2 0 00-2 2v10a2 2 0 002 2h10a2 2 0 002-2v-4M14 4h6m0 0v6m0-6L10 14" />
                    </svg>
                </a>
            </div>
        </div>
    </div>

    <!-- Lightbox Modal -->
    <div id="lightbox" class="lightbox-modal">
        <button class="close-btn" onclick="closeLightbox()">&times;</button>
        <img id="lightboxImg" class="lightbox-img" src="" alt="Enlarged Document">
        <div class="lightbox-controls">
            <button class="control-btn" onclick="zoomImage(0.25)">+</button>
            <button class="control-btn" onclick="zoomImage(-0.25)">-</button>
            <button class="control-btn" onclick="resetZoom()">&#215;</button>
        </div>
    </div>

    <script>
        // Tab switching logic
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

            if (tabId === 'receipts') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('receipts').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('bills').classList.add('active');
            }
        }

        // Copy Account Number
        function copyAccountNo() {
            const numberText = document.getElementById('accountNo').innerText;
            navigator.clipboard.writeText(numberText).then(() => {
                const copyIcon = document.getElementById('copyIcon');
                copyIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />`;
                copyIcon.style.color = 'var(--success-color)';

                setTimeout(() => {
                    copyIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />`;
                    copyIcon.style.color = '';
                }, 2000);
            });
        }

        // Lightbox Zoom & Pan Logic
        let scale = 1;
        let pointX = 0;
        let pointY = 0;
        let startX = 0;
        let startY = 0;
        let isDragging = false;

        const lightbox = document.getElementById('lightbox');
        const lightboxImg = document.getElementById('lightboxImg');

        function openLightbox(src) {
            lightboxImg.src = src;
            lightbox.classList.add('active');
            resetZoom();
        }

        function closeLightbox() {
            lightbox.classList.remove('active');
            lightboxImg.src = '';
        }

        function zoomImage(amount) {
            scale = Math.min(Math.max(1, scale + amount), 4);
            if (scale === 1) {
                pointX = 0;
                pointY = 0;
            }
            updateTransform();
        }

        function resetZoom() {
            scale = 1;
            pointX = 0;
            pointY = 0;
            updateTransform();
        }

        function updateTransform() {
            lightboxImg.style.transform = `translate(${pointX}px, ${pointY}px) scale(${scale})`;
        }

        // Drag / Pan Image
        lightboxImg.addEventListener('mousedown', (e) => {
            if (scale <= 1) return;
            e.preventDefault();
            isDragging = true;
            startX = e.clientX - pointX;
            startY = e.clientY - pointY;
        });

        window.addEventListener('mousemove', (e) => {
            if (!isDragging) return;
            e.preventDefault();
            pointX = e.clientX - startX;
            pointY = e.clientY - startY;
            updateTransform();
        });

        window.addEventListener('mouseup', () => {
            isDragging = false;
        });

        // Touch event support for Mobile Pan
        lightboxImg.addEventListener('touchstart', (e) => {
            if (scale <= 1 || e.touches.length !== 1) return;
            isDragging = true;
            startX = e.touches[0].clientX - pointX;
            startY = e.touches[0].clientY - pointY;
        });

        lightboxImg.addEventListener('touchmove', (e) => {
            if (!isDragging || e.touches.length !== 1) return;
            pointX = e.touches[0].clientX - startX;
            pointY = e.touches[0].clientY - startY;
            updateTransform();
        });

        lightboxImg.addEventListener('touchend', () => {
            isDragging = false;
        });

        // Close on background click
        lightbox.addEventListener('click', (e) => {
            if (e.target === lightbox) {
                closeLightbox();
            }
        });

        function renderFeed(jsonFile, containerId) {
            fetch(jsonFile)
                .then(response => response.json())
                .then(posts => {
                    const container = document.getElementById(containerId);

                    if (!posts || posts.length === 0) {
                        container.innerHTML = '<div class="empty-message">No records found.</div>';
                        return;
                    }

                    posts.forEach(post => {
                        const postDiv = document.createElement('div');
                        postDiv.className = 'post';

                        if (post.name && post.name.trim() !== "") {
                            const nameDiv = document.createElement('div');
                            nameDiv.className = 'photo-name';
                            nameDiv.textContent = post.name;
                            postDiv.appendChild(nameDiv);
                        }

                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'photo-container';

                        let validImagesCount = post.images.length;

                        post.images.forEach(imageUrl => {
                            const img = document.createElement('img');
                            img.src = imageUrl;
                            img.alt = post.name || "Document Image";
                            img.className = 'photo-img';
                            img.loading = 'lazy';

                            // Open full-screen lightbox on click/touch
                            img.onclick = () => openLightbox(imageUrl);

                            img.onerror = () => {
                                img.style.display = 'none';
                                validImagesCount--;
                                if (validImagesCount === 0) {
                                    postDiv.style.display = 'none';
                                }
                            };

                            imgContainer.appendChild(img);
                        });

                        postDiv.appendChild(imgContainer);
                        container.appendChild(postDiv);
                    });
                })
                .catch(error => {
                    console.error(`Error loading ${jsonFile}:`, error);
                    document.getElementById(containerId).innerHTML = '<div class="empty-message">Unable to load data.</div>';
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderFeed('aa_receipts.json', 'receipts');
            renderFeed('aa_bills.json', 'bills-feed');
        });
    </script>
</body>
</html>
