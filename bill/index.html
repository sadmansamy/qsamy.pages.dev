<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pally Bidyut 1060065233509</title>
    <style>
        :root {
            --bg-color: #090d16;
            --card-bg: rgba(18, 24, 38, 0.75);
            --card-border: rgba(255, 255, 255, 0.08);
            --primary-accent: #00f2fe;
            --secondary-accent: #4facfe;
            --neon-glow: rgba(0, 242, 254, 0.25);
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --success-color: #00e676;
            --border-radius: 18px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            background-color: var(--bg-color);
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Inter", sans-serif;
            color: var(--text-primary);
            padding-bottom: 40px;
            min-height: 100vh;
            background-image: 
                radial-gradient(circle at 50% 0%, rgba(0, 242, 254, 0.08) 0%, transparent 50%),
                radial-gradient(circle at 100% 100%, rgba(79, 172, 254, 0.05) 0%, transparent 40%);
            background-attachment: fixed;
        }

        /* Digital Futuristic Header */
        header {
            position: sticky;
            top: 0;
            background-color: rgba(9, 13, 22, 0.82);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            padding: 18px 20px;
            text-align: center;
            border-bottom: 1px solid var(--card-border);
            z-index: 1000;
        }

        .header-title {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 8px;
        }

        header h1 {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
            background: linear-gradient(135deg, #ffffff 30%, var(--primary-accent) 100%);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        /* Live Status Dot */
        .live-dot {
            width: 8px;
            height: 8px;
            background-color: var(--primary-accent);
            border-radius: 50%;
            box-shadow: 0 0 10px var(--primary-accent);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 8px rgba(0, 242, 254, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(0, 242, 254, 0); }
        }

        /* Account Badge & Copy Button */
        .account-number-container {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            margin-top: 8px;
            background: rgba(255, 255, 255, 0.04);
            padding: 6px 14px;
            border-radius: 20px;
            border: 1px solid rgba(255, 255, 255, 0.08);
            backdrop-filter: blur(8px);
            transition: all 0.3s ease;
        }

        .account-number-container:hover {
            border-color: rgba(0, 242, 254, 0.3);
            box-shadow: 0 0 12px var(--neon-glow);
        }

        .account-number {
            font-size: 13px;
            color: var(--text-secondary);
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            letter-spacing: 0.8px;
        }

        .copy-btn {
            background: none;
            border: none;
            cursor: pointer;
            padding: 2px;
            display: flex;
            align-items: center;
            justify-content: center;
            color: var(--text-secondary);
            transition: all 0.2s ease;
            position: relative;
        }

        .copy-btn:hover {
            color: var(--primary-accent);
            transform: scale(1.1);
        }

        .copy-btn svg {
            width: 15px;
            height: 15px;
        }

        .container {
            max-width: 500px;
            margin: 0 auto;
            padding: 20px 16px;
        }

        /* Segmented Cyberpunk Tab Switcher */
        .tab-switcher {
            display: flex;
            background: rgba(255, 255, 255, 0.03);
            padding: 5px;
            border-radius: 14px;
            margin-bottom: 24px;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(10px);
        }

        .tab-btn {
            flex: 1;
            padding: 12px 0;
            border: none;
            background: transparent;
            font-size: 14px;
            font-weight: 600;
            color: var(--text-secondary);
            border-radius: 10px;
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            letter-spacing: 0.3px;
        }

        .tab-btn.active {
            background: linear-gradient(135deg, rgba(0, 242, 254, 0.15) 0%, rgba(79, 172, 254, 0.15) 100%);
            color: #ffffff;
            border: 1px solid rgba(0, 242, 254, 0.4);
            box-shadow: 0 4px 15px var(--neon-glow);
            text-shadow: 0 0 8px rgba(0, 242, 254, 0.5);
        }

        /* View Panels */
        .tab-panel {
            display: none;
        }

        .tab-panel.active {
            display: block;
            animation: slideUp 0.3s ease-out;
        }

        @keyframes slideUp {
            from { opacity: 0; transform: translateY(8px); }
            to { opacity: 1; transform: translateY(0); }
        }

        /* Glassmorphism Card Design */
        .post {
            background: var(--card-bg);
            margin-bottom: 20px;
            border-radius: var(--border-radius);
            overflow: hidden;
            border: 1px solid var(--card-border);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            box-shadow: 0 8px 24px rgba(0, 0, 0, 0.3);
            transition: all 0.3s ease;
        }

        .post:hover {
            border-color: rgba(0, 242, 254, 0.2);
            transform: translateY(-2px);
            box-shadow: 0 12px 28px rgba(0, 0, 0, 0.4), 0 0 15px rgba(0, 242, 254, 0.1);
        }

        .photo-name {
            padding: 14px 18px;
            font-weight: 600;
            font-size: 14px;
            color: var(--text-primary);
            border-bottom: 1px solid var(--card-border);
            letter-spacing: 0.2px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        .photo-container {
            background-color: rgba(0, 0, 0, 0.2);
            padding: 10px;
            display: flex;
            flex-direction: column;
            gap: 10px;
        }

        .photo-img {
            width: 100%;
            height: auto;
            display: block;
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.25s ease;
        }

        .empty-message {
            text-align: center;
            color: var(--text-secondary);
            padding: 50px 0;
            font-size: 14px;
            letter-spacing: 0.5px;
        }
    </style>
</head>
<body>

    <!-- Header -->
    <header>
        <div class="header-title">
            <span class="live-dot"></span>
            <h1>Pally Bidyut (Postpaid)</h1>
        </div>
        <div class="account-number-container">
            <span class="account-number" id="accountNo">1060065233509</span>
            <button class="copy-btn" onclick="copyAccountNo()" title="Copy Account Number" id="copyBtn">
                <svg id="copyIcon" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />
                </svg>
            </button>
        </div>
    </header>

    <div class="container">
        <!-- Segmented Tab Switcher -->
        <div class="tab-switcher">
            <button class="tab-btn active" onclick="switchTab('receipts')">Receipts</button>
            <button class="tab-btn" onclick="switchTab('bills')">Bills</button>
        </div>

        <!-- Panel 1: Receipts -->
        <div id="receipts" class="tab-panel active"></div>

        <!-- Panel 2: Bills -->
        <div id="bills" class="tab-panel"></div>
    </div>

    <script>
        function switchTab(tabId) {
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-panel').forEach(panel => panel.classList.remove('active'));

            if (tabId === 'receipts') {
                document.querySelectorAll('.tab-btn')[0].classList.add('active');
                document.getElementById('receipts').classList.add('active');
            } else {
                document.querySelectorAll('.tab-btn')[1].classList.add('active');
                document.getElementById('bills').classList.add('active');
            }
        }

        function copyAccountNo() {
            const numberText = document.getElementById('accountNo').innerText;
            navigator.clipboard.writeText(numberText).then(() => {
                const copyIcon = document.getElementById('copyIcon');
                
                // Show glowing green checkmark feedback
                copyIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M5 13l4 4L19 7" />`;
                copyIcon.style.color = 'var(--success-color)';

                setTimeout(() => {
                    // Reset back to copy icon
                    copyIcon.innerHTML = `<path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M8 16H6a2 2 0 01-2-2V6a2 2 0 012-2h8a2 2 0 012 2v2m-6 12h8a2 2 0 002-2v-8a2 2 0 00-2-2h-8a2 2 0 00-2 2v8a2 2 0 002 2z" />`;
                    copyIcon.style.color = '';
                }, 2000);
            });
        }

        function renderFeed(jsonFile, containerId) {
            fetch(jsonFile)
                .then(response => response.json())
                .then(posts => {
                    const container = document.getElementById(containerId);

                    if (!posts || posts.length === 0) {
                        container.innerHTML = '<div class="empty-message">No records found.</div>';
                        return;
                    }

                    posts.forEach(post => {
                        const postDiv = document.createElement('div');
                        postDiv.className = 'post';

                        // Only render name header if string is not empty
                        if (post.name && post.name.trim() !== "") {
                            const nameDiv = document.createElement('div');
                            nameDiv.className = 'photo-name';
                            nameDiv.textContent = post.name;
                            postDiv.appendChild(nameDiv);
                        }

                        const imgContainer = document.createElement('div');
                        imgContainer.className = 'photo-container';

                        let validImagesCount = post.images.length;

                        post.images.forEach(imageUrl => {
                            const img = document.createElement('img');
                            img.src = imageUrl;
                            img.alt = post.name || "Document Image";
                            img.className = 'photo-img';
                            img.loading = 'lazy';

                            // Auto-hide missing images
                            img.onerror = () => {
                                img.style.display = 'none';
                                validImagesCount--;
                                if (validImagesCount === 0) {
                                    postDiv.style.display = 'none';
                                }
                            };

                            imgContainer.appendChild(img);
                        });

                        postDiv.appendChild(imgContainer);
                        container.appendChild(postDiv);
                    });
                })
                .catch(error => {
                    console.error(`Error loading ${jsonFile}:`, error);
                    document.getElementById(containerId).innerHTML = '<div class="empty-message">Unable to connect to data source.</div>';
                });
        }

        document.addEventListener('DOMContentLoaded', () => {
            renderFeed('aa_receipts.json', 'receipts');
            renderFeed('aa_bills.json', 'bills');
        });
    </script>
</body>
</html>
